{% extends "base.html" %}
{% block title %}Login — Purgearr{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-[var(--fond)]">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white tracking-tight">
        <span class="text-[var(--accent)]">Purge</span>arr
      </h1>
      <p class="text-[var(--doux)] text-sm mt-1">Media management for your homelab</p>
    </div>
    <div class="bg-[var(--surface)] rounded-xl p-8 shadow-2xl border border-[rgb(var(--filet-rgb)/0.50)]">
      <h2 class="text-lg font-semibold text-white mb-6">Sign in</h2>
      {% if error %}
      <div class="mb-4 px-4 py-3 rounded-lg bg-red-900/40 border border-red-700/50 text-red-300 text-sm">
        {{ error }}
      </div>
      {% endif %}
      <form method="post" action="/login">
        <div class="mb-4">
          <label class="block text-sm font-medium text-[var(--texte)] mb-1" for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus
            class="w-full px-3 py-2 rounded-lg bg-[var(--fond)] border border-[var(--filet-fort)] text-white placeholder-[var(--sourd)] focus:outline-none focus:border-[var(--accent)] focus:ring-1 focus:ring-[var(--accent)] transition" />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-[var(--texte)] mb-1" for="password">Password</label>
          <input type="password" id="password" name="password" required
            class="w-full px-3 py-2 rounded-lg bg-[var(--fond)] border border-[var(--filet-fort)] text-white placeholder-[var(--sourd)] focus:outline-none focus:border-[var(--accent)] focus:ring-1 focus:ring-[var(--accent)] transition" />
        </div>
        <button type="submit"
          class="w-full py-2 px-4 rounded-lg bg-[var(--accent)] hover:bg-[var(--accent-survol)] text-black font-semibold transition">
          Sign in
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
