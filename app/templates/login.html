{% extends "base.html" %}
{% block title %}Login — Purgearr{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-[#0f0f1a]">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white tracking-tight">
        <span class="text-[#e5a00d]">Purge</span>arr
      </h1>
      <p class="text-slate-400 text-sm mt-1">Media management for your homelab</p>
    </div>
    <div class="bg-[#1a1a2e] rounded-xl p-8 shadow-2xl border border-slate-700/50">
      <h2 class="text-lg font-semibold text-white mb-6">Sign in</h2>
      {% if error %}
      <div class="mb-4 px-4 py-3 rounded-lg bg-red-900/40 border border-red-700/50 text-red-300 text-sm">
        {{ error }}
      </div>
      {% endif %}
      <form method="post" action="/login">
        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-300 mb-1" for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus
            class="w-full px-3 py-2 rounded-lg bg-[#0f0f1a] border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:border-[#e5a00d] focus:ring-1 focus:ring-[#e5a00d] transition" />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-slate-300 mb-1" for="password">Password</label>
          <input type="password" id="password" name="password" required
            class="w-full px-3 py-2 rounded-lg bg-[#0f0f1a] border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:border-[#e5a00d] focus:ring-1 focus:ring-[#e5a00d] transition" />
        </div>
        <button type="submit"
          class="w-full py-2 px-4 rounded-lg bg-[#e5a00d] hover:bg-[#f5b01d] text-black font-semibold transition">
          Sign in
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
